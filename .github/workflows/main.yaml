name: main
on:
  push:
    branches: [main]

# Limit the concurrency of the whole main pipeline to prevent
# race conditions in back-to-back workflow runs
concurrency:
  group: deploy_production

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml
    secrets: inherit

  publish-release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}
    needs: ci
    environment:
      name: production
      url: https://timomeh.de
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/download-artifact@v8
        with:
          name: docker-image
          path: /tmp
      - name: load image
        run: docker load -i /tmp/docker-image.tar
      - name: publish image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
      - name: resolve image digest
        id: image
        run: |
          digest=$(docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Trigger deploy
        run: |
          curl --fail --request POST '${{ secrets.DEPLOY_WEBHOOK_BLOG }}' \
            --header 'Authorization: Bearer ${{ secrets.DEPLOY_TOKEN }}'
